<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');

      .bg-base { fill: #070711; }
      .bg-card { fill: #0D0D1B; stroke: rgba(52, 211, 153, 0.22); stroke-width: 1.5; rx: 12; }

      .card-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #34D399; letter-spacing: 2.5px; }
      .card-title { font-family: 'Press Start 2P', monospace; font-size: 15px; fill: #F4F4F8; letter-spacing: 1px; }
      .card-desc { font-family: 'Space Grotesk', sans-serif; font-size: 13px; fill: #A1A1AA; line-height: 1.45; }
      .card-chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #34D399; }

      .btn-box { fill: rgba(52, 211, 153, 0.12); stroke: #34D399; stroke-width: 1; rx: 6; }
      .btn-txt { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; fill: #F4F4F8; letter-spacing: 1.5px; }

      /* Animation for DNA helix / dynamic band */
      @keyframes bandSlide {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: -60; }
      }
      .anim-band { stroke-dasharray: 15, 10; animation: bandSlide 4s linear infinite; }

      .chip-bg { fill: rgba(52, 211, 153, 0.08); stroke: rgba(52, 211, 153, 0.25); stroke-width: 1; rx: 4; }
    </style>

    <radialGradient id="align-glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#070711" stop-opacity="0" />
    </radialGradient>

    <clipPath id="align-clip">
      <rect width="880" height="250" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#align-clip)">
    <rect width="880" height="250" class="bg-base" />
    <rect width="880" height="250" fill="url(#align-glow)" />
    <rect x="8" y="8" width="864" height="234" class="bg-card" />

    <!-- Left accent strip -->
    <rect x="8" y="8" width="5" height="234" fill="#34D399" />

    <!-- CONTENT (LEFT) -->
    <g transform="translate(42, 36)">
      <text x="0" y="0" class="card-tag">&#9670; ALGORITHMS // COMPUTATIONAL GENOMICS</text>
      <text x="0" y="30" class="card-title">ALIGNX // DNA SEQUENCE PIPELINE</text>
      
      <text x="0" y="64" class="card-desc">Cost-aware sequence comparison pipeline breaking O(N&#183;M) quadratic scale.</text>
      <text x="0" y="84" class="card-desc">Finds exact anchors via KMP/Rabin-Karp, isolates gaps, executes adaptively</text>
      <text x="0" y="104" class="card-desc">banded DP with boundary-aware retries, and falls back safely to exact DP.</text>

      <!-- Key Tech Chips -->
      <g transform="translate(0, 130)">
        <g transform="translate(0, 0)">
          <rect width="90" height="22" class="chip-bg" />
          <text x="45" y="15" class="card-chip" text-anchor="middle">KMP / Rabin</text>
        </g>
        <g transform="translate(98, 0)">
          <rect width="95" height="22" class="chip-bg" />
          <text x="47" y="15" class="card-chip" text-anchor="middle">Adaptive Band</text>
        </g>
        <g transform="translate(201, 0)">
          <rect width="90" height="22" class="chip-bg" />
          <text x="45" y="15" class="card-chip" text-anchor="middle">DP Fallback</text>
        </g>
        <g transform="translate(299, 0)">
          <rect width="90" height="22" class="chip-bg" />
          <text x="45" y="15" class="card-chip" text-anchor="middle">Streamlit</text>
        </g>
        <g transform="translate(397, 0)">
          <rect width="75" height="22" class="chip-bg" />
          <text x="37" y="15" class="card-chip" text-anchor="middle">Python</text>
        </g>
      </g>

      <!-- Action Button -->
      <g transform="translate(0, 166)">
        <rect width="180" height="28" class="btn-box" />
        <text x="90" y="18" class="btn-txt" text-anchor="middle">INSPECT REPOSITORY &#8594;</text>
      </g>
    </g>

    <!-- RIGHT: Pixel Banded DP Matrix Visual -->
    <g transform="translate(620, 36)">
      <rect x="0" y="0" width="220" height="178" fill="#071810" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5" rx="8" />
      <text x="110" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34D399" text-anchor="middle">BANDED DP MATRIX // TRACE</text>

      <!-- DP Matrix Grid representation -->
      <g transform="translate(30, 42)">
        <!-- Matrix cells boundary -->
        <rect x="0" y="0" width="160" height="96" fill="#040D09" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1" />
        
        <!-- Faint grid -->
        <line x1="32" y1="0" x2="32" y2="96" stroke="rgba(255, 255, 255, 0.05)" />
        <line x1="64" y1="0" x2="64" y2="96" stroke="rgba(255, 255, 255, 0.05)" />
        <line x1="96" y1="0" x2="96" y2="96" stroke="rgba(255, 255, 255, 0.05)" />
        <line x1="128" y1="0" x2="128" y2="96" stroke="rgba(255, 255, 255, 0.05)" />
        <line x1="0" y1="24" x2="160" y2="24" stroke="rgba(255, 255, 255, 0.05)" />
        <line x1="0" y1="48" x2="160" y2="48" stroke="rgba(255, 255, 255, 0.05)" />
        <line x1="0" y1="72" x2="160" y2="72" stroke="rgba(255, 255, 255, 0.05)" />

        <!-- Band Corridor Polygon -->
        <polygon points="0,0 35,0 160,75 160,96 125,96 0,20" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />

        <!-- Optimal Traceback Path -->
        <path d="M 0,0 L 40,24 L 80,48 L 120,72 L 160,96" fill="none" stroke="#34D399" stroke-width="2.5" class="anim-band" />
        
        <!-- Exact Anchor Highlight -->
        <circle cx="40" cy="24" r="4" fill="#22D3EE" />
        <circle cx="120" cy="72" r="4" fill="#22D3EE" />
      </g>

      <!-- Speedup stat -->
      <g transform="translate(15, 152)">
        <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="8" fill="#A1A1AA">BENCHMARK SPEEDUP:</text>
        <text x="135" y="10" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34D399">100x - 500x</text>
      </g>
    </g>

    <rect x="1" y="1" width="878" height="248" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1.5" rx="13" />
  </g>
</svg>
