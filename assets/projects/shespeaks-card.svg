<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      
      .bg { fill: #0B0B12; stroke: rgba(255,255,255,0.08); stroke-width: 1; rx: 16; }
      
      .title { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; fill: #ffffff; letter-spacing: 1px; }
      .subtitle { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #06B6D4; letter-spacing: 2px; }
      .desc { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400; fill: #9ca3af; line-height: 1.5; }
      
      .view-btn { fill: none; stroke: rgba(255,255,255,0.2); stroke-width: 1; rx: 12; }
      .view-text { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; letter-spacing: 1px; }

      .signal-ring { fill: none; stroke: #06B6D4; stroke-width: 1; opacity: 0; }
      
      @keyframes radar-ping {
        0% { r: 10; opacity: 0.8; stroke-width: 2; }
        100% { r: 80; opacity: 0; stroke-width: 0.5; }
      }
      .anim-ping { animation: radar-ping 4s ease-out infinite; }
      .anim-ping-delayed { animation: radar-ping 4s ease-out infinite 2s; }
    </style>
    
    <clipPath id="card-clip">
      <rect width="390" height="250" rx="16" />
    </clipPath>
  </defs>

  <rect width="390" height="250" fill="#050507" />
  
  <g clip-path="url(#card-clip)">
    <rect width="388" height="248" x="1" y="1" class="bg" />
    
    <!-- Abstract Visual: Privacy/Signal Motif -->
    <g transform="translate(300, 50)">
      <circle cx="0" cy="0" r="10" fill="#06B6D4" opacity="0.2" />
      <circle cx="0" cy="0" r="3" fill="#06B6D4" />
      <circle cx="0" cy="0" class="signal-ring anim-ping" />
      <circle cx="0" cy="0" class="signal-ring anim-ping-delayed" />
    </g>

    <!-- Content -->
    <g transform="translate(30, 40)">
      <text x="0" y="0" class="subtitle">SOCIAL IMPACT / SAFETY TECHNOLOGY</text>
      <text x="0" y="35" class="title">SHE SPEAKS</text>
      
      <text x="0" y="70" class="desc">A secure, anonymous platform for</text>
      <text x="0" y="90" class="desc">incident reporting and campus</text>
      <text x="0" y="110" class="desc">safety management.</text>
      
      <!-- Tech Pills (Compact) -->
      <g transform="translate(0, 140)">
        <text x="0" y="0" font-family="monospace" font-size="10" fill="#6366F1">#ANONYMITY &nbsp;#SECURE-REPORTING</text>
      </g>
      
      <!-- CTA -->
      <g transform="translate(0, 165)">
        <rect x="0" y="0" width="120" height="30" class="view-btn" />
        <text x="60" y="19" class="view-text" text-anchor="middle">VIEW PROJECT</text>
      </g>
    </g>
  </g>
</svg>
