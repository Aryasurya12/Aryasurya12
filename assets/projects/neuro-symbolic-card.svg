<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');

      .bg-base { fill: #070711; }
      .bg-card { fill: #0D0D1B; stroke: rgba(167, 139, 250, 0.22); stroke-width: 1.5; rx: 12; }

      .card-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #A78BFA; letter-spacing: 2.5px; }
      .card-title { font-family: 'Press Start 2P', monospace; font-size: 15px; fill: #F4F4F8; letter-spacing: 1px; }
      .card-desc { font-family: 'Space Grotesk', sans-serif; font-size: 13px; fill: #A1A1AA; line-height: 1.45; }
      .card-chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #8B5CF6; }

      .btn-box { fill: rgba(139, 92, 246, 0.12); stroke: #8B5CF6; stroke-width: 1; rx: 6; }
      .btn-txt { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; fill: #F4F4F8; letter-spacing: 1.5px; }

      /* Animation for solver race visualization */
      @keyframes solverPulse {
        0%, 100% { stroke-dashoffset: 40; opacity: 0.3; }
        50% { stroke-dashoffset: 0; opacity: 1; }
      }
      .anim-trace { stroke-dasharray: 20, 20; animation: solverPulse 3s linear infinite; }

      .chip-bg { fill: rgba(139, 92, 246, 0.08); stroke: rgba(139, 92, 246, 0.25); stroke-width: 1; rx: 4; }
    </style>

    <radialGradient id="nso-glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070711" stop-opacity="0" />
    </radialGradient>

    <clipPath id="nso-clip">
      <rect width="880" height="250" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#nso-clip)">
    <rect width="880" height="250" class="bg-base" />
    <rect width="880" height="250" fill="url(#nso-glow)" />
    <rect x="8" y="8" width="864" height="234" class="bg-card" />

    <!-- Left accent strip -->
    <rect x="8" y="8" width="5" height="234" fill="#8B5CF6" />

    <!-- CONTENT (LEFT) -->
    <g transform="translate(42, 36)">
      <text x="0" y="0" class="card-tag">&#9670; INTELLIGENT SYSTEMS // FINOPS ARCHITECTURE</text>
      <text x="0" y="30" class="card-title">NEURO-SYMBOLIC ORCHESTRATOR</text>
      
      <text x="0" y="64" class="card-desc">Strategic Cloud FinOps engine combining LLM natural language constraint</text>
      <text x="0" y="84" class="card-desc">extraction with strict mathematical verification. Isolates stochastic</text>
      <text x="0" y="104" class="card-desc">parsing from Z3 MaxSMT formal bounds &amp; metaheuristic solver races.</text>

      <!-- Key Tech Chips -->
      <g transform="translate(0, 130)">
        <g transform="translate(0, 0)">
          <rect width="88" height="22" class="chip-bg" />
          <text x="44" y="15" class="card-chip" text-anchor="middle">Z3 MaxSMT</text>
        </g>
        <g transform="translate(96, 0)">
          <rect width="82" height="22" class="chip-bg" />
          <text x="41" y="15" class="card-chip" text-anchor="middle">Pydantic</text>
        </g>
        <g transform="translate(186, 0)">
          <rect width="88" height="22" class="chip-bg" />
          <text x="44" y="15" class="card-chip" text-anchor="middle">GA + PSO</text>
        </g>
        <g transform="translate(282, 0)">
          <rect width="82" height="22" class="chip-bg" />
          <text x="41" y="15" class="card-chip" text-anchor="middle">FastAPI</text>
        </g>
        <g transform="translate(372, 0)">
          <rect width="82" height="22" class="chip-bg" />
          <text x="41" y="15" class="card-chip" text-anchor="middle">Python</text>
        </g>
      </g>

      <!-- Action Button -->
      <g transform="translate(0, 166)">
        <rect width="180" height="28" class="btn-box" />
        <text x="90" y="18" class="btn-txt" text-anchor="middle">INSPECT REPOSITORY &#8594;</text>
      </g>
    </g>

    <!-- RIGHT: Pixel Circuit / Solver Flow Art -->
    <g transform="translate(620, 36)">
      <!-- Circuit board frame -->
      <rect x="0" y="0" width="220" height="178" fill="#090915" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1.5" rx="8" />
      <text x="110" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#A78BFA" text-anchor="middle">PARALLEL SOLVER RACE</text>

      <!-- Stage Nodes -->
      <!-- Input Node -->
      <rect x="85" y="40" width="50" height="20" fill="#171530" stroke="#8B5CF6" stroke-width="1" rx="3" />
      <text x="110" y="53" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F4F4F8" text-anchor="middle">CONTRACT</text>

      <!-- Lines branching -->
      <path d="M110,60 L45,86 M110,60 L110,86 M110,60 L175,86" fill="none" stroke="#8B5CF6" stroke-width="1.5" class="anim-trace" />

      <!-- Solver 1: GA -->
      <rect x="20" y="86" width="50" height="22" fill="#121226" stroke="#22D3EE" stroke-width="1" rx="3" />
      <text x="45" y="100" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22D3EE" text-anchor="middle">GA</text>

      <!-- Solver 2: PSO -->
      <rect x="85" y="86" width="50" height="22" fill="#121226" stroke="#A78BFA" stroke-width="1" rx="3" />
      <text x="110" y="100" font-family="'JetBrains Mono', monospace" font-size="8" fill="#A78BFA" text-anchor="middle">PSO</text>

      <!-- Solver 3: Z3 -->
      <rect x="150" y="86" width="50" height="22" fill="#121226" stroke="#34D399" stroke-width="1" rx="3" />
      <text x="175" y="100" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399" text-anchor="middle">Z3 SMT</text>

      <!-- Convergence lines -->
      <path d="M45,108 L110,132 M110,108 L110,132 M175,108 L110,132" fill="none" stroke="#34D399" stroke-width="1.5" />

      <!-- Winner Selector -->
      <rect x="65" y="132" width="90" height="24" fill="#0F241A" stroke="#34D399" stroke-width="1.5" rx="4" />
      <text x="110" y="147" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#34D399" text-anchor="middle">OPTIHIVE SELECTOR</text>

      <!-- Status dot -->
      <circle cx="195" cy="20" r="3" fill="#34D399" />
    </g>

    <rect x="1" y="1" width="878" height="248" fill="none" stroke="rgba(167, 139, 250, 0.25)" stroke-width="1.5" rx="13" />
  </g>
</svg>
