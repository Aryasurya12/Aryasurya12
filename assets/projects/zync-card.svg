<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');

      .bg-base { fill: #070711; }
      .bg-card { fill: #0D0D1B; stroke: rgba(167, 139, 250, 0.22); stroke-width: 1.5; rx: 12; }

      .card-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #A78BFA; letter-spacing: 2.5px; }
      .card-title { font-family: 'Press Start 2P', monospace; font-size: 15px; fill: #F4F4F8; letter-spacing: 1px; }
      .card-desc { font-family: 'Space Grotesk', sans-serif; font-size: 13px; fill: #A1A1AA; line-height: 1.45; }
      .card-chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #A78BFA; }

      .btn-box { fill: rgba(167, 139, 250, 0.12); stroke: #8B5CF6; stroke-width: 1; rx: 6; }
      .btn-txt { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; fill: #F4F4F8; letter-spacing: 1.5px; }

      /* Animation for learning sync network */
      @keyframes syncPulse {
        0%, 100% { stroke-dashoffset: 40; opacity: 0.3; }
        50% { stroke-dashoffset: 0; opacity: 1; }
      }
      .anim-sync { stroke-dasharray: 20, 20; animation: syncPulse 3s linear infinite; }

      .chip-bg { fill: rgba(167, 139, 250, 0.08); stroke: rgba(167, 139, 250, 0.25); stroke-width: 1; rx: 4; }
    </style>

    <radialGradient id="zync-glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070711" stop-opacity="0" />
    </radialGradient>

    <clipPath id="zync-clip">
      <rect width="880" height="250" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#zync-clip)">
    <rect width="880" height="250" class="bg-base" />
    <rect width="880" height="250" fill="url(#zync-glow)" />
    <rect x="8" y="8" width="864" height="234" class="bg-card" />

    <!-- Left accent strip -->
    <rect x="8" y="8" width="5" height="234" fill="#8B5CF6" />

    <!-- CONTENT (LEFT) -->
    <g transform="translate(42, 36)">
      <text x="0" y="0" class="card-tag">&#9670; EDTECH OS // REAL-TIME CLASSROOM INTELLIGENCE</text>
      <text x="0" y="30" class="card-title">ZYNC // AI LEARNING OPERATING SYSTEM</text>
      
      <text x="0" y="64" class="card-desc">Next-generation educational platform replacing static curricula with dynamic</text>
      <text x="0" y="84" class="card-desc">AI question generation, real-time classroom confusion heatmaps, and personalized</text>
      <text x="0" y="104" class="card-desc">gamified skill trees powered by Google GenAI and Supabase backend.</text>

      <!-- Key Tech Chips -->
      <g transform="translate(0, 130)">
        <g transform="translate(0, 0)">
          <rect width="115" height="22" class="chip-bg" />
          <text x="57" y="15" class="card-chip" text-anchor="middle">Google GenAI</text>
        </g>
        <g transform="translate(123, 0)">
          <rect width="88" height="22" class="chip-bg" />
          <text x="44" y="15" class="card-chip" text-anchor="middle">Supabase</text>
        </g>
        <g transform="translate(219, 0)">
          <rect width="88" height="22" class="chip-bg" />
          <text x="44" y="15" class="card-chip" text-anchor="middle">TypeScript</text>
        </g>
        <g transform="translate(315, 0)">
          <rect width="78" height="22" class="chip-bg" />
          <text x="39" y="15" class="card-chip" text-anchor="middle">React</text>
        </g>
        <g transform="translate(401, 0)">
          <rect width="88" height="22" class="chip-bg" />
          <text x="44" y="15" class="card-chip" text-anchor="middle">Tailwind</text>
        </g>
      </g>

      <!-- Action Button -->
      <g transform="translate(0, 166)">
        <rect width="180" height="28" class="btn-box" />
        <text x="90" y="18" class="btn-txt" text-anchor="middle">INSPECT REPOSITORY &#8594;</text>
      </g>
    </g>

    <!-- RIGHT: Pixel Classroom Neural Sync Network -->
    <g transform="translate(620, 36)">
      <rect x="0" y="0" width="220" height="178" fill="#0C0B1B" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1.5" rx="8" />
      <text x="110" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#A78BFA" text-anchor="middle">NEURAL SYNC HEATMAP</text>

      <!-- Constellation Graph -->
      <g transform="translate(20, 42)">
        <path d="M30,30 L90,15 L150,35 L120,80 L50,75 Z" fill="none" stroke="rgba(167, 139, 250, 0.25)" stroke-width="1" />
        <path d="M30,30 L120,80 M90,15 L50,75 M90,15 L120,80" fill="none" stroke="#8B5CF6" stroke-width="1.5" class="anim-sync" />

        <circle cx="30" cy="30" r="5" fill="#8B5CF6" />
        <circle cx="90" cy="15" r="7" fill="#22D3EE" />
        <circle cx="150" cy="35" r="4" fill="#34D399" />
        <circle cx="120" cy="80" r="6" fill="#8B5CF6" />
        <circle cx="50" cy="75" r="5" fill="#22D3EE" />

        <!-- Center pulse -->
        <circle cx="90" cy="48" r="3" fill="#FFFFFF" />
      </g>

      <!-- Heatmap sync badge -->
      <g transform="translate(15, 152)">
        <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="8" fill="#A1A1AA">CLASS STATUS:</text>
        <text x="85" y="10" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34D399">&#9679; 100% SYNCED</text>
      </g>
    </g>

    <rect x="1" y="1" width="878" height="248" fill="none" stroke="rgba(167, 139, 250, 0.25)" stroke-width="1.5" rx="13" />
  </g>
</svg>
