<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.4)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.1)" />
    </linearGradient>
  </defs>

  <rect width="598" height="218" x="1" y="1" rx="12" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.5" />
  
  <text x="30" y="40" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1.5" fill="#8B5CF6">
    FEATURED / 01
  </text>

  <text x="30" y="85" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">
    ZYNC
  </text>

  <text x="30" y="120" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#A1A1AA">
    AI-first educational operating system.
  </text>
  <text x="30" y="145" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#A1A1AA">
    Replacing static curriculum with dynamic AI generation.
  </text>

  <g transform="translate(30, 175)">
    <rect width="60" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
    <text x="30" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">React</text>
    
    <rect x="70" width="70" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
    <text x="105" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">Gemini</text>
    
    <rect x="150" width="85" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
    <text x="192.5" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">Supabase</text>

    <rect x="245" width="95" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
    <text x="292.5" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(540, 80)">
    <circle cx="15" cy="15" r="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <path d="M10,15 L20,15 M15,10 L20,15 L15,20" stroke="#FFFFFF" stroke-width="2" fill="none" />
  </g>
</svg>
