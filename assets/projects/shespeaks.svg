<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.4)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.1)" />
    </linearGradient>
  </defs>

  <rect width="598" height="218" x="1" y="1" rx="12" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.5" />
  
  <text x="30" y="40" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1.5" fill="#EC4899">
    FEATURED / 02
  </text>

  <text x="30" y="85" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">
    SheSpeaks
  </text>

  <text x="30" y="120" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#A1A1AA">
    Anonymous reporting and social-impact safety tech.
  </text>
  <text x="30" y="145" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#A1A1AA">
    Incident management designed for privacy and emergency response.
  </text>

  <g transform="translate(30, 175)">
    <rect width="80" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
    <text x="40" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">Safety Tech</text>
    
    <rect x="90" width="80" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
    <text x="130" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">Anonymous</text>
    
    <rect x="180" width="130" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
    <text x="245" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">Emergency Response</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(540, 80)">
    <circle cx="15" cy="15" r="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <path d="M10,15 L20,15 M15,10 L20,15 L15,20" stroke="#FFFFFF" stroke-width="2" fill="none" />
  </g>
</svg>
