<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="100%" stop-color="#0B0B12" />
    </linearGradient>
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="800" height="250" fill="url(#bg)" />

  <text x="400" y="40" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="16" font-weight="600" fill="#E4E4E7" text-anchor="middle" letter-spacing="2">
    KRAMA-PĀṬHA INSPIRED ECC
  </text>
  <text x="400" y="65" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA" text-anchor="middle">
    Error correction modeling inspired by ancient Vedic recitation patterns.
  </text>

  <!-- Diagram boxes -->
  <g transform="translate(100, 120)">
    <!-- Node 1 -->
    <rect width="90" height="40" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="45" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle">DATA</text>

    <!-- Arrow 1 -->
    <path d="M90,20 L130,20" stroke="url(#flow-grad)" stroke-width="2" fill="none" marker-end="url(#arrow)" />

    <!-- Node 2 -->
    <rect x="130" width="110" height="40" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5" />
    <text x="185" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle">KRAMA CHAIN</text>

    <!-- Arrow 2 -->
    <path d="M240,20 L280,20" stroke="url(#flow-grad)" stroke-width="2" fill="none" marker-end="url(#arrow)" />

    <!-- Node 3 -->
    <rect x="280" width="90" height="40" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5" />
    <text x="325" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle">SYNDROME</text>

    <!-- Arrow 3 -->
    <path d="M370,20 L410,20" stroke="url(#flow-grad)" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    
    <!-- Node 4 -->
    <rect x="410" width="130" height="40" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1.5" />
    <text x="475" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle">RECONSTRUCTION</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#A855F7" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Flowing particles -->
  <circle r="3" fill="#6366F1">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 190,140 L 230,140" />
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#A855F7">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 340,140 L 380,140" />
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#06B6D4">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 470,140 L 510,140" />
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>

</svg>
