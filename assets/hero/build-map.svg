<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;family=Inter:wght@400;600&amp;display=swap');
      
      .center-text { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; fill: #ffffff; letter-spacing: 4px; }
      .node-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #a1a1aa; letter-spacing: 1px; }
      
      .connection { stroke: rgba(255,255,255,0.06); stroke-width: 1.5; fill: none; }
      .connection-glow { stroke: url(#gradient-accent); stroke-width: 2; fill: none; opacity: 0; }
      
      .center-node { fill: #0B0B12; stroke: #8B5CF6; stroke-width: 2; }
      .outer-node { fill: #0B0B12; stroke: rgba(255,255,255,0.1); stroke-width: 1; }
      
      @keyframes pulse-line {
        0% { stroke-dashoffset: 150; opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { stroke-dashoffset: -150; opacity: 0; }
      }
      .anim-conn { animation: pulse-line 6s linear infinite; stroke-dasharray: 50, 200; }
      
      @keyframes float-node {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .floating-grp { animation: float-node 8s ease-in-out infinite; }
      
    </style>

    <linearGradient id="gradient-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050507" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="300" fill="#050507" />
  
  <rect width="800" height="300" fill="url(#glow-center)" />

  <!-- Section Title -->
  <text x="400" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#6366F1" letter-spacing="3" text-anchor="middle">WHAT I BUILD</text>

  <g transform="translate(400, 160)">
    
    <!-- Connections -->
    <!-- Top Left: SOFTWARE -->
    <path class="connection" d="M -25 -25 L -120 -60" />
    <path class="connection-glow anim-conn" d="M -25 -25 L -120 -60" style="animation-delay: 0s;" />
    
    <!-- Top Right: AI -->
    <path class="connection" d="M 25 -25 L 120 -60" />
    <path class="connection-glow anim-conn" d="M 25 -25 L 120 -60" style="animation-delay: 1s;" />
    
    <!-- Bottom Left: WEB -->
    <path class="connection" d="M -30 10 L -140 30" />
    <path class="connection-glow anim-conn" d="M -30 10 L -140 30" style="animation-delay: 2s;" />
    
    <!-- Bottom Right: SYSTEMS -->
    <path class="connection" d="M 30 10 L 140 30" />
    <path class="connection-glow anim-conn" d="M 30 10 L 140 30" style="animation-delay: 3s;" />
    
    <!-- Top Center: RESEARCH -->
    <path class="connection" d="M 0 -35 L 0 -100" />
    <path class="connection-glow anim-conn" d="M 0 -35 L 0 -100" style="animation-delay: 4s;" />
    
    <!-- Bottom Center: OPEN SOURCE -->
    <path class="connection" d="M 0 35 L 0 90" />
    <path class="connection-glow anim-conn" d="M 0 35 L 0 90" style="animation-delay: 5s;" />
    
    <!-- Outer Nodes -->
    <g class="floating-grp" style="animation-delay: 0s;"><rect x="-200" y="-80" width="100" height="40" rx="20" class="outer-node" /><text x="-150" y="-55" class="node-text" text-anchor="middle">SOFTWARE</text></g>
    <g class="floating-grp" style="animation-delay: 1s;"><rect x="100" y="-80" width="60" height="40" rx="20" class="outer-node" /><text x="130" y="-55" class="node-text" text-anchor="middle">AI</text></g>
    <g class="floating-grp" style="animation-delay: 2s;"><rect x="-210" y="10" width="70" height="40" rx="20" class="outer-node" /><text x="-175" y="35" class="node-text" text-anchor="middle">WEB</text></g>
    <g class="floating-grp" style="animation-delay: 3s;"><rect x="140" y="10" width="90" height="40" rx="20" class="outer-node" /><text x="185" y="35" class="node-text" text-anchor="middle">SYSTEMS</text></g>
    <g class="floating-grp" style="animation-delay: 4s;"><rect x="-55" y="-120" width="110" height="40" rx="20" class="outer-node" /><text x="0" y="-95" class="node-text" text-anchor="middle">RESEARCH</text></g>
    <g class="floating-grp" style="animation-delay: 5s;"><rect x="-65" y="90" width="130" height="40" rx="20" class="outer-node" /><text x="0" y="115" class="node-text" text-anchor="middle">OPEN SOURCE</text></g>
    
    <!-- Center Node -->
    <circle cx="0" cy="0" r="45" class="center-node" />
    <circle cx="0" cy="0" r="50" class="connection" stroke-dasharray="4, 4" />
    <text x="0" y="8" class="center-text" text-anchor="middle">ARYA</text>
  </g>
</svg>
