<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');

      .bg-base { fill: #070711; }
      .bg-card { fill: #0D0D1B; stroke: rgba(167, 139, 250, 0.2); stroke-width: 1.5; rx: 12; }

      .ops-hdr { font-family: 'Press Start 2P', monospace; font-size: 11px; fill: #F4F4F8; letter-spacing: 1px; }
      .ops-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #22D3EE; letter-spacing: 2px; }
      .ops-name { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; fill: #F4F4F8; }
      .ops-desc { font-family: 'Space Grotesk', sans-serif; font-size: 11.5px; fill: #A1A1AA; line-height: 1.35; }
      .ops-chip { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; }

      @keyframes liveRadar {
        0% { transform: scale(0.6); opacity: 0.9; }
        100% { transform: scale(1.8); opacity: 0; }
      }
      .anim-radar { animation: liveRadar 2.5s ease-out infinite; transform-origin: center; }

      @keyframes progressPulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .anim-prog { animation: progressPulse 2s ease-in-out infinite; }

      .item-bg { fill: rgba(255, 255, 255, 0.02); stroke: rgba(255, 255, 255, 0.07); stroke-width: 1; rx: 8; }
    </style>

    <clipPath id="ops-clip">
      <rect width="880" height="200" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#ops-clip)">
    <rect width="880" height="200" class="bg-base" />
    <rect x="12" y="12" width="856" height="176" class="bg-card" />

    <!-- Terminal Header Bar -->
    <g transform="translate(32, 28)">
      <!-- Radar Status Indicator -->
      <g transform="translate(10, 8)">
        <circle cx="0" cy="0" r="5" fill="#34D399" />
        <circle cx="0" cy="0" r="8" fill="none" stroke="#34D399" stroke-width="1.5" class="anim-radar" />
      </g>
      <text x="24" y="12" class="ops-hdr">ACTIVE OPERATIONS // CURRENTLY BUILDING</text>
      <text x="590" y="12" class="ops-tag">SYSTEM TIME: REAL-TIME</text>
    </g>

    <!-- 3 Operation Tiles -->
    <g transform="translate(32, 54)">
      <!-- Operation 1 -->
      <g transform="translate(0, 0)">
        <rect width="264" height="114" class="item-bg" />
        <!-- Top Status Bar -->
        <rect x="0" y="0" width="264" height="2" fill="#8B5CF6" />
        <text x="14" y="22" class="ops-chip" fill="#8B5CF6">&#9679; STAGE: REFINEMENT</text>
        <text x="14" y="42" class="ops-name">Neuro-Symbolic Cloud FinOps</text>
        <text x="14" y="62" class="ops-desc">LLM constraint contracts evaluated</text>
        <text x="14" y="78" class="ops-desc">against Z3 MaxSMT formal bounds</text>
        <text x="14" y="98" class="ops-chip" fill="#A78BFA">TARGET: Z3 + Metaheuristics</text>
      </g>

      <!-- Operation 2 -->
      <g transform="translate(276, 0)">
        <rect width="264" height="114" class="item-bg" />
        <rect x="0" y="0" width="264" height="2" fill="#22D3EE" />
        <text x="14" y="22" class="ops-chip" fill="#22D3EE">&#9679; STAGE: EDGE DEPLOYMENT</text>
        <text x="14" y="42" class="ops-name">AstroFlow AI Edge Copilot</text>
        <text x="14" y="62" class="ops-desc">100% offline vision &amp; voice assistant</text>
        <text x="14" y="78" class="ops-desc">for orbital station procedures (BAS)</text>
        <text x="14" y="98" class="ops-chip" fill="#22D3EE">TARGET: BiLSTM + YOLOv8 + Next.js</text>
      </g>

      <!-- Operation 3 -->
      <g transform="translate(552, 0)">
        <rect width="264" height="114" class="item-bg" />
        <rect x="0" y="0" width="264" height="2" fill="#34D399" />
        <text x="14" y="22" class="ops-chip" fill="#34D399">&#9679; STAGE: ALGORITHMIC RESEARCH</text>
        <text x="14" y="42" class="ops-name">Adaptive Banded DNA AlignX</text>
        <text x="14" y="62" class="ops-desc">Exact anchor decomposition with</text>
        <text x="14" y="78" class="ops-desc">boundary-retry dynamic programming</text>
        <text x="14" y="98" class="ops-chip" fill="#34D399">TARGET: KMP + Banded DP</text>
      </g>
    </g>

    <!-- Highlight border -->
    <rect x="1" y="1" width="878" height="198" fill="none" stroke="rgba(167, 139, 250, 0.25)" stroke-width="1.5" rx="13" />
  </g>
</svg>
