<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 20)">
    <!-- Card 1 -->
    <rect width="180" height="80" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="90" y="35" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">EXCS ENGINEER</text>
    <text x="90" y="55" font-family="'Inter', sans-serif" font-size="10" fill="#A1A1AA" text-anchor="middle">Software + CS</text>
  </g>

  <g transform="translate(205, 20)">
    <!-- Card 2 -->
    <rect width="180" height="80" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="90" y="35" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI BUILDER</text>
    <text x="90" y="55" font-family="'Inter', sans-serif" font-size="10" fill="#A1A1AA" text-anchor="middle">Intelligent Systems</text>
    <text x="90" y="70" font-family="'Inter', sans-serif" font-size="10" fill="#A1A1AA" text-anchor="middle">+ Experimentation</text>
  </g>

  <g transform="translate(400, 20)">
    <!-- Card 3 -->
    <rect width="180" height="80" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="90" y="35" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">CREATIVE ENGR</text>
    <text x="90" y="55" font-family="'Inter', sans-serif" font-size="10" fill="#A1A1AA" text-anchor="middle">Interfaces + Motion</text>
    <text x="90" y="70" font-family="'Inter', sans-serif" font-size="10" fill="#A1A1AA" text-anchor="middle">+ Interaction</text>
  </g>

  <g transform="translate(595, 20)">
    <!-- Card 4 -->
    <rect width="180" height="80" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="90" y="35" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OPEN SOURCE</text>
    <text x="90" y="55" font-family="'Inter', sans-serif" font-size="10" fill="#A1A1AA" text-anchor="middle">Learning + Building</text>
    <text x="90" y="70" font-family="'Inter', sans-serif" font-size="10" fill="#A1A1AA" text-anchor="middle">+ Collaborating</text>
  </g>
</svg>
