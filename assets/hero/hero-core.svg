<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;display=swap');
      .name { font-family: 'Space Grotesk', sans-serif; font-size: 56px; font-weight: 700; fill: #ffffff; letter-spacing: 4px; }
      .tagline { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 400; fill: #a1a1aa; letter-spacing: 2px; }
      .subtag { font-family: monospace; font-size: 12px; fill: #8B5CF6; letter-spacing: 3px; }
      
      .node { fill: rgba(255,255,255,0.15); }
      .node-core { fill: #8B5CF6; }
      .path { stroke: rgba(255,255,255,0.06); stroke-width: 1; fill: none; }
      .pulse-path { stroke: url(#gradient-accent); stroke-width: 1.5; fill: none; stroke-dasharray: 10, 200; stroke-dashoffset: 0; }
      
      @keyframes travel {
        0% { stroke-dashoffset: 210; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { stroke-dashoffset: -210; opacity: 0; }
      }
      .anim-pulse { animation: travel 8s linear infinite; }
      .anim-pulse-delayed { animation: travel 12s linear infinite 4s; }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-10px) translateX(5px); }
      }
      .floating { animation: float 15s ease-in-out infinite; transform-origin: center; }
      .floating-slow { animation: float 25s ease-in-out infinite reverse; transform-origin: center; }
    </style>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050507" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="gradient-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <filter id="blur-filter">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="800" height="300" fill="#050507" />
  
  <rect width="800" height="300" fill="url(#glow)" />

  <g class="floating">
    <!-- Neural Network Background -->
    <path class="path" d="M100,50 L250,120 L350,60 L500,90 L700,40 M250,120 L200,200 L400,250 L550,180 L700,40 M350,60 L550,180" />
    <path class="path" d="M50,180 L180,260 L400,250 M500,90 L600,120 L750,220 M200,200 L300,150 L400,250" />
    <path class="path" d="M120,80 L300,150 L500,90 M600,120 L650,260 L750,220 M180,260 L300,150 M550,180 L650,260" />

    <!-- Animated Pulses -->
    <path class="pulse-path anim-pulse" d="M100,50 L250,120 L350,60 L500,90 L700,40" />
    <path class="pulse-path anim-pulse-delayed" d="M50,180 L180,260 L400,250 L550,180 L700,40" />
    <path class="pulse-path anim-pulse" d="M120,80 L300,150 L600,120 L750,220" style="animation-duration: 10s;" />

    <!-- Nodes -->
    <circle cx="100" cy="50" r="2" class="node" />
    <circle cx="250" cy="120" r="3" class="node" />
    <circle cx="350" cy="60" r="2" class="node" />
    <circle cx="500" cy="90" r="3" class="node" />
    <circle cx="700" cy="40" r="2" class="node" />
    
    <circle cx="200" cy="200" r="2" class="node" />
    <circle cx="400" cy="250" r="4" class="node-core" />
    <circle cx="550" cy="180" r="3" class="node" />
    
    <circle cx="50" cy="180" r="2" class="node" />
    <circle cx="180" cy="260" r="3" class="node" />
    <circle cx="600" cy="120" r="2" class="node" />
    <circle cx="750" cy="220" r="3" class="node" />
    
    <circle cx="120" cy="80" r="2" class="node" />
    <circle cx="300" cy="150" r="4" class="node-core" />
    <circle cx="650" cy="260" r="2" class="node" />
    
    <!-- Particles -->
    <circle cx="150" cy="150" r="1" fill="#fff" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="80" r="1" fill="#fff" opacity="0.3"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="220" r="1.5" fill="#06B6D4" opacity="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Foreground Text -->
  <g text-anchor="middle">
    <text x="400" y="145" class="name">ARYA SURYAVANSHI</text>
    <text x="400" y="180" class="tagline">BUILDING DIGITAL WORLDS</text>
    <text x="400" y="215" class="subtag">SOFTWARE &#215; AI &#215; SYSTEMS</text>
  </g>
</svg>
