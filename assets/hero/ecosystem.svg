<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Central Node -->
  <circle cx="400" cy="100" r="30" fill="url(#glow)" fill-opacity="0.2" stroke="url(#glow)" stroke-width="1.5" />
  <text x="400" y="105" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">ARYA</text>

  <!-- Connection Lines -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none">
    <path d="M 400,70 L 400,30" /> <!-- Top -->
    <path d="M 400,130 L 400,170" /> <!-- Bottom -->
    <path d="M 370,100 L 250,100" /> <!-- Left -->
    <path d="M 430,100 L 550,100" /> <!-- Right -->
    <path d="M 378,78 L 290,40" /> <!-- Top Left -->
  </g>

  <!-- Outer Nodes -->
  <!-- Top: Web -->
  <rect x="360" y="10" width="80" height="24" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="400" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">Web</text>

  <!-- Bottom: Research -->
  <rect x="360" y="170" width="80" height="24" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="400" y="186" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">Research</text>

  <!-- Left: AI -->
  <rect x="170" y="88" width="80" height="24" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="210" y="104" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">AI</text>

  <!-- Right: Systems -->
  <rect x="550" y="88" width="80" height="24" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="590" y="104" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">Systems</text>

  <!-- Top Left: Software -->
  <rect x="210" y="28" width="80" height="24" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="250" y="44" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" text-anchor="middle">Software</text>
  
  <!-- Particles -->
  <circle r="2" fill="#8B5CF6">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 400,70 L 400,30" />
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#06B6D4">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 370,100 L 250,100" />
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#06B6D4">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 430,100 L 550,100" />
    <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>

</svg>
