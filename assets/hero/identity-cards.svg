<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      .card-bg { fill: rgba(255,255,255,0.02); stroke: rgba(255,255,255,0.08); stroke-width: 1; rx: 12; }
      .card-title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; letter-spacing: 1px; }
      .card-desc { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400; fill: #9ca3af; }
      .icon-stroke { stroke: #8B5CF6; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      
      .glow-accent { fill: url(#glow); opacity: 0.5; }
    </style>
    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050507" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="250" fill="#050507" />

  <!-- Section Title -->
  <text x="400" y="40" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#6366F1" letter-spacing="3" text-anchor="middle">A LITTLE ABOUT ARYA</text>
  
  <g transform="translate(40, 80)">
    <!-- Card 1: Software Builder -->
    <g transform="translate(0, 0)">
      <rect width="220" height="130" class="card-bg" />
      <circle cx="110" cy="65" r="80" class="glow-accent" />
      <!-- Icon (Code/Terminal) -->
      <path d="M20,25 L35,40 L20,55 M45,55 L60,55" class="icon-stroke" transform="translate(0, 0) scale(0.6)" />
      
      <text x="25" y="65" class="card-title">SOFTWARE BUILDER</text>
      <text x="25" y="90" class="card-desc">Architecting robust systems</text>
      <text x="25" y="110" class="card-desc">from frontend to backend.</text>
    </g>
    
    <!-- Card 2: AI Explorer -->
    <g transform="translate(250, 0)">
      <rect width="220" height="130" class="card-bg" />
      <circle cx="110" cy="65" r="80" class="glow-accent" />
      <!-- Icon (Neural/AI) -->
      <path d="M25,40 A15,15 0 1,1 40,25 M40,25 L40,55 M25,40 L55,40 M40,55 A15,15 0 1,1 55,40" class="icon-stroke" transform="translate(0, 0) scale(0.6)" />
      
      <text x="25" y="65" class="card-title">AI EXPLORER</text>
      <text x="25" y="90" class="card-desc">Integrating intelligence</text>
      <text x="25" y="110" class="card-desc">and data into applications.</text>
    </g>
    
    <!-- Card 3: System Thinker -->
    <g transform="translate(500, 0)">
      <rect width="220" height="130" class="card-bg" />
      <circle cx="110" cy="65" r="80" class="glow-accent" />
      <!-- Icon (Layers/System) -->
      <path d="M20,30 L40,20 L60,30 L40,40 Z M20,40 L40,50 L60,40 M20,50 L40,60 L60,50" class="icon-stroke" transform="translate(0, 0) scale(0.6)" />
      
      <text x="25" y="65" class="card-title">SYSTEM THINKER</text>
      <text x="25" y="90" class="card-desc">Designing for scale,</text>
      <text x="25" y="110" class="card-desc">reliability, and impact.</text>
    </g>
  </g>
</svg>
