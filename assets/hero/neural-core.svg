<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="50%" stop-color="#0B0B12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <radialGradient id="glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.15)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0)" />
    </radialGradient>
    <radialGradient id="glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.15)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0)" />
    </radialGradient>

    <!-- Node Glow -->
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#06B6D4;#8B5CF6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#A855F7;#06B6D4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" fill="url(#bg-grad)" />
  <rect width="1000" height="300" fill="url(#glow-1)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect width="1000" height="300" fill="url(#glow-2)">
    <animate attributeName="opacity" values="1;0.6;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g stroke="rgba(255,255,255,0.05)" stroke-width="1.5">
    <!-- Lines for the neural network -->
    <path d="M 100,50 L 250,120 L 400,80 L 550,150 L 700,90 L 850,160 M 250,120 L 300,220 L 500,280 L 700,210 L 850,160 M 150,200 L 300,220 M 400,80 L 500,280 M 550,150 L 700,210 M 700,90 L 900,60" fill="none">
      <animate attributeName="stroke" values="rgba(255,255,255,0.05);rgba(255,255,255,0.15);rgba(255,255,255,0.05)" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 50,150 L 150,200 L 200,280 M 800,260 L 950,200 L 900,60" fill="none" />
  </g>

  <!-- Nodes -->
  <g fill="rgba(255,255,255,0.8)" filter="url(#node-glow)">
    <circle cx="100" cy="50" r="2" />
    <circle cx="250" cy="120" r="3">
      <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="80" r="2.5" />
    <circle cx="550" cy="150" r="3.5">
      <animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="90" r="2" />
    <circle cx="850" cy="160" r="3" />
    <circle cx="300" cy="220" r="2.5" />
    <circle cx="500" cy="280" r="2" />
    <circle cx="700" cy="210" r="3" />
    <circle cx="150" cy="200" r="2" />
    <circle cx="900" cy="60" r="2" />
    <circle cx="50" cy="150" r="1.5" />
    <circle cx="200" cy="280" r="2" />
    <circle cx="800" cy="260" r="1.5" />
    <circle cx="950" cy="200" r="2" />
  </g>

  <!-- Travelling signals -->
  <circle r="3" fill="#06B6D4" filter="url(#node-glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 100,50 L 250,120 L 400,80 L 550,150" />
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#8B5CF6" filter="url(#node-glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 900,60 L 700,90 L 550,150 L 500,280" />
    <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Text Content -->
  <text x="500" y="140" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="48" font-weight="800" letter-spacing="4" fill="url(#text-grad)" text-anchor="middle">
    ARYA SURYAVANSHI
  </text>
  <text x="500" y="175" font-family="'Inter', 'Manrope', sans-serif" font-size="14" font-weight="400" letter-spacing="6" fill="#A1A1AA" text-anchor="middle">
    BUILDING DIGITAL EXPERIENCES
  </text>
  <text x="500" y="200" font-family="'Inter', monospace" font-size="10" font-weight="500" letter-spacing="2" fill="rgba(255,255,255,0.4)" text-anchor="middle">
    SOFTWARE × AI × SYSTEMS × OPEN SOURCE
  </text>
</svg>
